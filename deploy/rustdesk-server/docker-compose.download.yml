services:
  fetch:
    image: curlimages/curl:8.10.1
    user: "0:0"
    command:
      - sh
      - -c
      - '[ -s /data/rustdesk-1.5.1-x86_64.exe ] || { curl -fL -o /data/rustdesk-1.5.1-x86_64.exe.part https://github.com/rustdesk/rustdesk/releases/download/1.5.1/rustdesk-1.5.1-x86_64.exe && mv -f /data/rustdesk-1.5.1-x86_64.exe.part /data/rustdesk-1.5.1-x86_64.exe; }'
    volumes:
      - ../files/download:/data
    restart: "no"

  web:
    image: nginx:1.27-alpine
    depends_on:
      fetch:
        condition: service_completed_successfully
    volumes:
      - ../files/download:/data:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
      - source: index_html
        target: /usr/share/nginx/html/index.html
    restart: unless-stopped

configs:
  nginx_conf:
    content: |
      server {
        listen 80;
        root /usr/share/nginx/html;
        location = / { try_files /index.html =404; }
        location = /RafaDesk.exe {
          alias /data/rustdesk-1.5.1-x86_64.exe;
          default_type application/octet-stream;
          add_header Content-Disposition 'attachment; filename="RafaDesk-1.5.1-licensed-QfiUmbpxmbv5ybulGbvNmch1GblFmZhJnLvN3clNWYiojI5FGblJnIsISPzZkYQNWZyhlRDtSaoJHM5JFRFN0KxI3YEtiWzNmdGdjb4hTNEZTd2IkdxJiOikXZrJCLiUmbpxmbv5ybulGbvNmch1GblFmZhJnLvN3clNWYiojI0N3boJye.exe"';
        }
        location / { return 404; }
      }
  index_html:
    content: |
      <!doctype html>
      <html lang="pt-BR">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>RafaDesk - Suporte remoto</title>
      <link rel="icon" type="image/webp" href="data:image/webp;base64,">
      <style>
        :root { color-scheme: light dark; --bg:#f4f4f5; --card:#fff; --fg:#211f1f; --muted:#5f5b5b; --accent:#2475b7; --accent-fg:#fff; --line:#e6e4e4; }
        @media (prefers-color-scheme: dark) { :root { --bg:#121111; --card:#1c1b1b; --fg:#f2f0f0; --muted:#a8a3a3; --line:#2e2c2c; } }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
        main { position:relative; overflow:hidden; width:100%; max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 28px; }
        main::before { content:""; position:absolute; inset:0 0 auto 0; height:5px; background:linear-gradient(90deg,#ff0000 0 33.3%,#ec9826 33.3% 66.6%,#2475b7 66.6%); }
        header { display:flex; align-items:center; gap:14px; margin:0 0 20px; }
        header img { width:56px; height:56px; flex:none; }
        h1 { margin:0; font-size:26px; line-height:1.1; }
        header small { display:block; color:var(--muted); font-size:14px; }
        p.sub { margin:0 0 24px; color:var(--muted); }
        a.btn { display:block; text-align:center; background:var(--accent); color:var(--accent-fg); text-decoration:none; font-weight:600; font-size:18px; padding:14px 20px; border-radius:10px; }
        a.btn:hover { filter:brightness(1.08); }
        .note { margin:8px 0 28px; text-align:center; color:var(--muted); font-size:13px; }
        ol { margin:0; padding-left:22px; }
        li { margin:0 0 10px; }
        li strong { color:var(--fg); }
        footer { margin-top:24px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
      </style>
      </head>
      <body>
      <main>
        <header>
          <img src="data:image/webp;base64," alt="" width="56" height="56">
          <div><h1>RafaDesk</h1><small>Rafa Consultoria em TI</small></div>
        </header>
        <p class="sub">Suporte remoto. Baixe, abra e passe o ID e a senha para o técnico.</p>
        <a class="btn" href="/RafaDesk.exe">Baixar para Windows</a>
        <p class="note">Não precisa instalar. Não renomeie o arquivo baixado.</p>
        <ol>
          <li>Clique em <strong>Baixar para Windows</strong>.</li>
          <li>Abra o arquivo baixado. Se o Windows avisar, clique em <strong>Mais informações → Executar assim mesmo</strong>.</li>
          <li>Informe ao técnico o <strong>ID</strong> e a <strong>senha</strong> que aparecem na tela.</li>
          <li>Quando ele conectar, clique em <strong>Aceitar</strong>.</li>
        </ol>
        <footer>Rafa Consultoria em TI</footer>
      </main>
      </body>
      </html>
