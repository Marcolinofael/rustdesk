          <p class="hint">Ou instale pelo terminal:</p>
          <div class="cmd"><code id="cmd">curl -fsSL https://acesso.rafaelmarcolino.online/install.sh | sudo bash</code><button type="button" id="copy" aria-label="Copiar comando">Copiar</button></div>
        </section>
        <footer><span>Rafa Consultoria em TI</span><a href="https://rafaelmarcolino.online">rafaelmarcolino.online</a></footer>
