        .cmd { display:flex; align-items:center; gap:8px; background:#050505; border:1px solid var(--line); border-radius:12px; padding:10px 10px 10px 14px; }
        .cmd code { flex:1; min-width:0; overflow-x:auto; white-space:nowrap; font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; color:#e5e5e5; scrollbar-width:thin; }
        .cmd button { flex:none; background:var(--btn); color:var(--btn-fg); border:0; border-radius:8px; padding:6px 12px; font:600 13px system-ui,sans-serif; cursor:pointer; }
        .cmd button:hover { background:#fff; }
        footer { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
        footer a { color:var(--muted); }
