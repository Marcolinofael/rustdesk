        <h2>Suporte <span class="grad">remoto</span></h2>
        <p class="sub">Baixe, abra e passe o ID e a senha para o técnico.</p>
        <a class="btn" href="/RafaDesk.exe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Baixar para Windows</a>
        <p class="note">Não precisa instalar para receber suporte.</p>
        <ol>
          <li>Clique em <strong>Baixar para Windows</strong>.</li>
          <li>Abra o arquivo baixado. Se o Windows avisar, clique em <strong>Mais informações → Executar assim mesmo</strong>.</li>
          <li>Informe ao técnico o <strong>ID</strong> e a <strong>senha</strong> que aparecem na tela.</li>
          <li>Quando ele conectar, clique em <strong>Aceitar</strong>.</li>
