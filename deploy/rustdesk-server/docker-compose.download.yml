        * { box-sizing: border-box; }
        html, body { margin:0; min-height:100%; }
        body { min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
        .bg { position:fixed; inset:0; z-index:-1; background:var(--bg); }
        .bg svg { position:absolute; inset:0; width:100%; height:100%; }
        .bg::after { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(10,10,10,.85) 0%, rgba(10,10,10,.55) 45%, transparent 85%); }
        @keyframes circuit-pulse { 0% { stroke-dashoffset: var(--d); } 65%, 100% { stroke-dashoffset: calc(var(--l) * -1); } }
        .circuit-pulse { animation: circuit-pulse linear infinite; }
        @media (prefers-reduced-motion: reduce) { .circuit-pulse { opacity:0; animation:none; } }
        main { position:relative; width:100%; max-width:480px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px 28px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 0 0 1px rgba(255,255,255,.02), 0 30px 80px -20px rgba(0,0,0,.8); }
        main::before { content:""; position:absolute; inset:-1px; z-index:-1; border-radius:25px; background:linear-gradient(135deg, rgba(251,191,36,.35), rgba(239,68,68,.25), rgba(56,189,248,.35)); filter:blur(18px); opacity:.55; }
        header { display:flex; align-items:center; gap:14px; margin:0 0 22px; }
