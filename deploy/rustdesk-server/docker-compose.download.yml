        li::before { content:counter(s); position:absolute; left:0; top:0; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:600; background:rgba(255,255,255,.06); border:1px solid var(--line); }
        li:nth-child(1)::before { color:#fbbf24; } li:nth-child(2)::before { color:#ef4444; } li:nth-child(3)::before { color:#38bdf8; } li:nth-child(4)::before { color:#fbbf24; }
        li strong { color:var(--fg); }
